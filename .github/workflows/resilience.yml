name: BroadLink resilience

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # broadlink_manager imports requests at module load time. Keep this
      # workflow self-contained even when the Phase 1 requirements lock is
      # not part of the PR's base branch yet.
      - run: python -m pip install pytest==9.1.1 broadlink==0.19.0 requests==2.34.2
      - run: python -m compileall -q omni-broadlink-addon/src
      - run: python -m pytest -q
