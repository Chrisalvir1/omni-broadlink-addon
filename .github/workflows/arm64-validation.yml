name: ARM64 add-on validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'omni-broadlink-addon/**'
      - '.github/workflows/arm64-validation.yml'
  push:
    branches: ['codex/phase1-core-2026-10']
    paths:
      - 'omni-broadlink-addon/**'
      - '.github/workflows/arm64-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-container:
    name: Native ARM64 build and runtime smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runner
        run: test "$(uname -m)" = aarch64
      - name: Build without publishing
        working-directory: omni-broadlink-addon
        run: |
          docker build --platform linux/arm64 --build-arg BUILD_FROM=alpine:3.19 \
            --tag broadlink-arm64:ci .
          test "$(docker image inspect broadlink-arm64:ci --format '{{.Architecture}}')" = arm64
      - name: Verify ARM64 Python and compiled dependencies
        run: |
          docker run --rm -i --network none --entrypoint python3 broadlink-arm64:ci - <<'PY'
          import platform
          import sys

          assert platform.machine() == "aarch64"
          assert sys.version_info[:2] == (3, 11)

          import broadlink
          import fastapi
          import pydantic
          import requests
          import uvicorn
          from cffi import FFI
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          FFI()
          AESGCM.generate_key(bit_length=128)
          import src.main

          print("ARM64 application imports and compiled dependencies verified")
          PY
          docker run --rm --network none --entrypoint python3 broadlink-arm64:ci -m pip check
