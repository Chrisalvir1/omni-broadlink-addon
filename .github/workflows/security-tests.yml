name: Security tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: omni-broadlink-addon/requirements-test.lock
      - run: python -m pip install --require-hashes -r omni-broadlink-addon/requirements-test.lock
      - run: python -m compileall -q omni-broadlink-addon/src
      - run: pytest -q
